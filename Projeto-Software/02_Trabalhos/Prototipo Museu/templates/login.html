<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Museu Treze de Maio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background-color: #0f0f0f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* ── Logo / Cabeçalho ── */
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header h1 {
            color: #1f8f5f;
            font-size: 32px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .login-header p {
            color: #555;
            font-size: 13px;
            margin-top: 6px;
            letter-spacing: 1px;
        }

        .divider {
            width: 60px;
            height: 2px;
            background-color: #0b3d2e;
            margin: 14px auto 0;
            border-radius: 2px;
        }

        /* ── Card de Login ── */
        .container {
            width: 420px;
            background-color: #1a1a1a;
            padding: 36px 36px 32px;
            border-radius: 12px;
            box-shadow: 0px 0px 30px rgba(0,0,0,0.7);
            border: 2px solid #0b3d2e;
        }

        /* ── Mensagem de erro ── */
        .mensagem-erro {
            background-color: #3d0b0b;
            border: 1px solid #8f1f1f;
            color: #ff9999;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 14px;
            margin-bottom: 22px;
            text-align: center;
        }

        /* ── Mensagem de sucesso ── */
        .mensagem-sucesso {
            background-color: #0b3d2e44;
            border: 1px solid #1f8f5f;
            color: #1f8f5f;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 14px;
            margin-bottom: 22px;
            text-align: center;
        }

        label {
            font-weight: bold;
            color: #d9d9d9;
            font-size: 14px;
            display: block;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            margin-bottom: 20px;
            border-radius: 6px;
            border: 1px solid #0b3d2e;
            background-color: #121212;
            color: white;
            font-size: 14px;
            font-family: Arial, sans-serif;
            transition: 0.2s;
        }

        input:focus {
            outline: none;
            border: 1px solid #1f8f5f;
            box-shadow: 0px 0px 6px rgba(31,143,95,0.4);
        }

        input::placeholder { color: #444; }

        /* ── Botão ── */
        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background-color: #0b3d2e;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 4px;
        }

        button[type="submit"]:hover {
            background-color: #1f8f5f;
        }

        /* ── Rodapé do card ── */
        .login-footer {
            text-align: center;
            margin-top: 24px;
            color: #444;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="login-wrapper">

    <div class="login-header">
        <h1>Museu Treze de Maio</h1>
        <p>Sistema de Gestão do Acervo</p>
        <div class="divider"></div>
    </div>

    <div class="container">



        <form action="/login" method="post">

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="seu@email.com" autofocus>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" placeholder="••••••••">

            <button type="submit">Entrar</button>

        </form>

    </div>

    <div class="login-footer">
        &copy; Museu Treze de Maio — Acesso restrito a administradores e funcionários
    </div>

</div>

</body>
</html>
